<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 일일 활동 기록 - 캘린더</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        /* 탭 */
        .tabs-container {
            background: white;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
        }
        
        .tab {
            flex: 1;
            padding: 18px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: #f9f9f9;
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            background: #f8f9ff;
        }
        
        .tab-content {
            background: white;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            display: none;
            min-height: 600px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* 탭 1 */
        .main-content {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 30px;
        }
        
        .calendar-box {
            background: #f9f9f9;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        
        .calendar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .calendar-header h2 {
            font-size: 24px;
        }
        
        .header-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .add-event-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }
        
        .add-event-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .calendar {
            padding: 20px;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 6px;
        }
        
        .weekday-header {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            padding: 10px;
            font-size: 14px;
        }
        
        .weekday-header.sunday {
            color: #e74c3c;
        }
        
        .weekday-header.saturday {
            color: #3498db;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        
        .day {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            position: relative;
            padding: 6px;
            min-height: 150px;
        }
        
        .day:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
        }
        
        .day.other-month {
            color: #ccc;
            background: #f9f9f9;
            cursor: default;
        }
        
        .day.other-month:hover {
            border-color: #e0e0e0;
            box-shadow: none;
        }
        
        .day.today {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        .day.selected {
            box-shadow: inset 0 0 0 3px #667eea;
        }
        
        .day-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .day-number {
            font-size: 14px;
            font-weight: 600;
        }
        
        .day.today .day-number {
            background: #667eea;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .day-number.sunday-num,
        .day-number.holiday-num {
            color: #e74c3c;
        }
        
        .day-number.saturday-num {
            color: #3498db;
        }
        
        .day.today .day-number.sunday-num,
        .day.today .day-number.saturday-num,
        .day.today .day-number.holiday-num {
            color: white;
        }
        
        .day-holiday-name {
            font-size: 10px;
            color: #e74c3c;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .day-record-check {
            font-size: 12px;
            color: #667eea;
            font-weight: 700;
        }
        
        .day-plus-btn {
            display: none;
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            border: none;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        .day:hover .day-plus-btn {
            display: flex;
        }
        
        .day-plan-list {
            width: 100%;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }
        
        .day-plan-item {
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
            cursor: pointer;
        }
        
        .day-plan-item:hover {
            opacity: 0.85;
        }
        
        .day-plan-more {
            background: #eee;
            color: #666;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
            cursor: pointer;
        }
        
        .day-plan-more:hover {
            background: #ddd;
        }
        
        /* 기록 박스 */
        .record-box {
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }
        
        .record-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .record-header h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .selected-date {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .record-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 560px;
        }
        
        .day-events-preview {
            margin-bottom: 15px;
        }
        
        .day-events-preview h4 {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        
        .preview-event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        
        .preview-event-item span.edit-hint {
            font-size: 11px;
            opacity: 0.85;
        }
        
        .category-record {
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            background: white;
        }
        
        .category-record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .category-name {
            font-weight: 600;
            color: #667eea;
            font-size: 15px;
        }
        
        .category-record textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            min-height: 80px;
            transition: border-color 0.3s;
        }
        
        .category-record textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .save-btn, .reset-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .reset-btn {
            background: #f0f0f0;
            color: #333;
        }
        
        .reset-btn:hover {
            background: #e0e0e0;
        }
        
        .status-message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }
        
        /* 탭 2: 카테고리 관리 */
        .category-manager {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #e0e0e0;
        }
        
        .category-manager h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .category-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .category-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .category-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .add-category-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .add-category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .categories-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .category-tag {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
            color: #667eea;
        }
        
        .category-tag-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }
        
        .category-tag-delete:hover {
            background: #ff5252;
        }
        
        /* 탭 3: 조회 */
        .query-container {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 25px;
            border: 1px solid #e0e0e0;
        }
        
        .query-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .query-control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .query-control-group label {
            font-weight: 600;
            font-size: 13px;
            color: #555;
        }
        
        .query-control-group input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .query-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            align-self: flex-end;
        }
        
        .category-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .category-select-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
        }
        
        .category-select-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .query-results {
            display: grid;
            gap: 15px;
        }
        
        .result-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
        }
        
        .result-date {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        .result-content {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
        }
        
        .no-result {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 14px;
        }
        
        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-box h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        
        .modal-field {
            margin-bottom: 18px;
        }
        
        .modal-field label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        
        .modal-field input[type="text"],
        .modal-field input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .modal-field input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .date-range-row {
            display: flex;
            gap: 10px;
        }
        
        .date-range-row > div {
            flex: 1;
        }
        
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }
        
        .color-swatch.selected {
            border-color: #333;
            transform: scale(1.15);
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal-save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .modal-save-btn:hover {
            transform: translateY(-2px);
        }
        
        .modal-delete-btn {
            background: #ff6b6b;
            color: white;
        }
        
        .modal-delete-btn:hover {
            background: #ff5252;
        }
        
        .modal-cancel-btn {
            background: #f0f0f0;
            color: #333;
        }
        
        .modal-cancel-btn:hover {
            background: #e0e0e0;
        }
        
        @media (max-width: 1100px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 600px) {
            .tab-content { padding: 15px; }
            .day { min-height: 100px; }
            .day-plan-item { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 일일 활동 기록</h1>
            <p>업무를 효율적으로 관리하세요</p>
        </div>
        
        <div class="tabs-container">
            <div class="tab active" onclick="switchTab('calendar')">📅 달력 & 활동기록</div>
            <div class="tab" onclick="switchTab('category')">📊 카테고리 관리</div>
            <div class="tab" onclick="switchTab('query')">🔍 카테고리별 조회</div>
        </div>
        
        <!-- 탭 1 -->
        <div id="calendar" class="tab-content active">
            <div class="main-content">
                <div class="calendar-box">
                    <div class="calendar-header">
                        <h2 id="monthYear"></h2>
                        <div class="header-buttons">
                            <button class="add-event-btn" onclick="openEventModal(null, formatDate(currentDate))">➕ 예정 작업 추가</button>
                            <div class="nav-buttons">
                                <button class="nav-btn" onclick="previousMonth()">←</button>
                                <button class="nav-btn" onclick="goToday()">오늘</button>
                                <button class="nav-btn" onclick="nextMonth()">→</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="calendar">
                        <div class="weekdays">
                            <div class="weekday-header sunday">일</div>
                            <div class="weekday-header">월</div>
                            <div class="weekday-header">화</div>
                            <div class="weekday-header">수</div>
                            <div class="weekday-header">목</div>
                            <div class="weekday-header">금</div>
                            <div class="weekday-header saturday">토</div>
                        </div>
                        <div class="days" id="daysContainer"></div>
                    </div>
                </div>
                
                <div class="record-box">
                    <div class="record-header">
                        <h3>📝 활동 기록</h3>
                        <div class="selected-date" id="selectedDate">날짜를 선택해주세요</div>
                    </div>
                    
                    <div class="record-content" id="recordContent">
                        <div style="text-align: center; color: #999; padding: 20px;">날짜를 선택해주세요</div>
                    </div>
                    
                    <div style="padding: 20px; border-top: 1px solid #e0e0e0;">
                        <div class="button-group">
                            <button class="save-btn" onclick="saveAllRecords()">💾 저장하기</button>
                        </div>
                        <div class="status-message" id="statusMessage"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 탭 2 -->
        <div id="category" class="tab-content">
            <div class="category-manager">
                <h3>⚙️ 카테고리 관리</h3>
                <p style="color: #666; font-size: 14px; margin-bottom: 15px;">새로운 카테고리를 추가하거나 기존 카테고리를 삭제할 수 있습니다.</p>
                
                <div class="category-controls">
                    <input type="text" id="newCategoryInput" class="category-input" placeholder="새로운 카테고리 이름을 입력하세요 (예: 수처리)">
                    <button class="add-category-btn" onclick="addCategory()">➕ 추가</button>
                </div>
                
                <h4 style="color: #333; margin: 25px 0 15px 0; font-size: 16px;">등록된 카테고리</h4>
                <div class="categories-list" id="categoriesList"></div>
            </div>
        </div>
        
        <!-- 탭 3 -->
        <div id="query" class="tab-content">
            <div class="query-container">
                <h3 style="margin-bottom: 20px;">🔍 카테고리별 활동 조회</h3>
                
                <div class="query-controls">
                    <div class="query-control-group" style="flex: 1;">
                        <label>시작일</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="query-control-group" style="flex: 1;">
                        <label>종료일</label>
                        <input type="date" id="endDate">
                    </div>
                    <button class="query-btn" onclick="updateDateRange()">검색</button>
                </div>
                
                <h4 style="color: #333; margin: 20px 0 15px 0;">카테고리 선택</h4>
                <div class="category-selector" id="categorySelector"></div>
                
                <h4 style="color: #333; margin: 20px 0 15px 0;">조회 결과</h4>
                <div class="query-results" id="queryResults">
                    <div class="no-result">카테고리를 선택하고 검색 버튼을 클릭하세요</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 예정 작업 추가/수정 모달 -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-box">
            <h3 id="modalTitle">📌 예정 작업 추가</h3>
            
            <div class="modal-field">
                <label>작업 내용</label>
                <input type="text" id="eventTitleInput" placeholder="예: 설비 A 점검">
            </div>
            
            <div class="modal-field">
                <label>기간</label>
                <div class="date-range-row">
                    <div>
                        <input type="date" id="eventStartInput">
                    </div>
                    <div>
                        <input type="date" id="eventEndInput">
                    </div>
                </div>
            </div>
            
            <div class="modal-field">
                <label>색상</label>
                <div class="color-picker" id="colorPicker"></div>
            </div>
            
            <div class="modal-buttons">
                <button class="modal-btn modal-save-btn" onclick="saveEvent()">💾 저장</button>
                <button class="modal-btn modal-delete-btn" id="deleteEventBtn" onclick="deleteEvent()" style="display:none;">🗑️ 삭제</button>
                <button class="modal-btn modal-cancel-btn" onclick="closeEventModal()">취소</button>
            </div>
        </div>
    </div>
    
    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSlyOzBo8EAFw-jxhior2bBFaEc9XrY39ZCcgO82X4aV54-OZcttnB-iYUwxOBNKjxqw/exec";
        
        const COLOR_PALETTE = [
            '#ff6b6b', '#ff9f43', '#feca57', '#1dd1a1', 
            '#54a0ff', '#5f27cd', '#ee5a6f', '#576574'
        ];
        
        // 대한민국 공휴일 (대체공휴일·임시공휴일 포함)
        const KR_HOLIDAYS = {
            // 2025년
            "2025-01-01": "신정",
            "2025-01-28": "설날연휴",
            "2025-01-29": "설날",
            "2025-01-30": "설날연휴",
            "2025-03-01": "삼일절",
            "2025-03-03": "대체공휴일(삼일절)",
            "2025-05-05": "어린이날·부처님오신날",
            "2025-05-06": "대체공휴일",
            "2025-06-06": "현충일",
            "2025-08-15": "광복절",
            "2025-10-03": "개천절",
            "2025-10-05": "추석연휴",
            "2025-10-06": "추석",
            "2025-10-07": "추석연휴",
            "2025-10-08": "대체공휴일(추석)",
            "2025-10-09": "한글날",
            "2025-12-25": "크리스마스",
            // 2026년
            "2026-01-01": "신정",
            "2026-02-16": "설날연휴",
            "2026-02-17": "설날",
            "2026-02-18": "설날연휴",
            "2026-03-01": "삼일절",
            "2026-03-02": "대체공휴일(삼일절)",
            "2026-05-05": "어린이날",
            "2026-05-24": "부처님오신날",
            "2026-05-25": "대체공휴일(부처님오신날)",
            "2026-06-03": "전국동시지방선거",
            "2026-06-06": "현충일",
            "2026-07-17": "제헌절",
            "2026-08-15": "광복절",
            "2026-08-17": "대체공휴일(광복절)",
            "2026-09-24": "추석연휴",
            "2026-09-25": "추석",
            "2026-09-26": "추석연휴",
            "2026-10-03": "개천절",
            "2026-10-05": "대체공휴일(개천절)",
            "2026-10-09": "한글날",
            "2026-12-25": "크리스마스",
            // 2027년
            "2027-01-01": "신정",
            "2027-02-06": "설날연휴",
            "2027-02-07": "설날",
            "2027-02-08": "설날연휴",
            "2027-02-09": "대체공휴일(설날)",
            "2027-03-01": "삼일절",
            "2027-05-05": "어린이날",
            "2027-05-13": "부처님오신날",
            "2027-06-06": "현충일",
            "2027-07-17": "제헌절",
            "2027-08-15": "광복절",
            "2027-08-16": "대체공휴일(광복절)",
            "2027-09-14": "추석연휴",
            "2027-09-15": "추석",
            "2027-09-16": "추석연휴",
            "2027-10-03": "개천절",
            "2027-10-04": "대체공휴일(개천절)",
            "2027-10-09": "한글날",
            "2027-10-11": "대체공휴일(한글날)",
            "2027-12-25": "크리스마스"
        };
        
        let currentDate = new Date();
        let selectedDate = null;
        let records = {};       // { "2026-08-25": { "수처리": "내용" } }
        let events = [];        // [{ id, title, start, end, color }]
        let categories = ['수처리', '냉동기', '보일러'];
        let selectedCategoryForQuery = null;
        let queryStartDate = null;
        let queryEndDate = null;
        let editingEventId = null;
        let selectedColor = COLOR_PALETTE[0];
        
        function init() {
            loadRecords();
            loadEvents();
            loadCategories();
            renderCategories();
            renderCategorySelector();
            renderColorPicker();
            renderCalendar();
            goToday();
            
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = lastDay;
        }
        
        // ===== 저장/로드 =====
        function loadRecords() {
            const stored = localStorage.getItem('activityRecords');
            records = stored ? JSON.parse(stored) : {};
        }
        
        function loadEvents() {
            const stored = localStorage.getItem('calendarEvents');
            events = stored ? JSON.parse(stored) : [];
        }
        
        function loadCategories() {
            const stored = localStorage.getItem('activityCategories');
            if (stored) categories = JSON.parse(stored);
        }
        
        function saveRecordsToStorage() {
            localStorage.setItem('activityRecords', JSON.stringify(records));
        }
        
        function saveEventsToStorage() {
            localStorage.setItem('calendarEvents', JSON.stringify(events));
        }
        
        function saveCategoriesToStorage() {
            localStorage.setItem('activityCategories', JSON.stringify(categories));
        }
        
        // ===== 탭 전환 =====
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        // ===== 카테고리 관리 =====
        function addCategory() {
            const input = document.getElementById('newCategoryInput');
            const name = input.value.trim();
            
            if (!name) { alert('카테고리 이름을 입력해주세요'); return; }
            if (categories.includes(name)) { alert('이미 존재하는 카테고리입니다'); return; }
            
            categories.push(name);
            saveCategoriesToStorage();
            input.value = '';
            renderCategories();
            renderCategorySelector();
            if (selectedDate) renderRecordForm();
        }
        
        function deleteCategory(name) {
            if (!confirm(`'${name}' 카테고리를 삭제하시겠습니까?`)) return;
            
            categories = categories.filter(c => c !== name);
            for (const date in records) delete records[date][name];
            
            saveCategoriesToStorage();
            saveRecordsToStorage();
            renderCategories();
            renderCategorySelector();
            if (selectedDate) renderRecordForm();
        }
        
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = categories.map(category => `
                <div class="category-tag">
                    <span>${category}</span>
                    <button class="category-tag-delete" onclick="deleteCategory('${category}')">✕</button>
                </div>
            `).join('');
        }
        
        function renderCategorySelector() {
            const container = document.getElementById('categorySelector');
            container.innerHTML = categories.map(category => `
                <button class="category-select-btn" onclick="selectCategoryForQuery('${category}')">${category}</button>
            `).join('');
        }
        
        function selectCategoryForQuery(category) {
            selectedCategoryForQuery = category;
            document.querySelectorAll('.category-select-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            queryRecords();
        }
        
        function updateDateRange() {
            queryRecords();
        }
        
        function queryRecords() {
            if (!selectedCategoryForQuery) {
                document.getElementById('queryResults').innerHTML = '<div class="no-result">카테고리를 선택해주세요</div>';
                return;
            }
            
            queryStartDate = new Date(document.getElementById('startDate').value);
            queryEndDate = new Date(document.getElementById('endDate').value);
            
            const results = [];
            for (const dateStr in records) {
                const date = new Date(dateStr);
                if (date >= queryStartDate && date <= queryEndDate) {
                    const content = records[dateStr][selectedCategoryForQuery];
                    if (content) results.push({ date: dateStr, content });
                }
            }
            
            results.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (results.length === 0) {
                document.getElementById('queryResults').innerHTML = '<div class="no-result">해당 기간에 기록이 없습니다</div>';
                return;
            }
            
            const html = results.map(item => {
                const date = new Date(item.date);
                const dateLabel = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
                return `
                    <div class="result-item">
                        <div class="result-date">📅 ${dateLabel}</div>
                        <div class="result-content">${item.content}</div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('queryResults').innerHTML = html;
        }
        
        // ===== 캘린더 렌더링 =====
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
            document.getElementById('monthYear').textContent = `${year}년 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const firstWeekday = firstDay.getDay();
            const lastDate = lastDay.getDate();
            
            let html = '';
            
            for (let i = 0; i < firstWeekday; i++) {
                html += '<div class="day other-month"></div>';
            }
            
            const today = new Date();
            for (let d = 1; d <= lastDate; d++) {
                const dateObj = new Date(year, month, d);
                const dateStr = formatDate(dateObj);
                const isToday = dateObj.toDateString() === today.toDateString();
                const isSelected = dateStr === selectedDate;
                const dayOfWeek = dateObj.getDay(); // 0=일, 6=토
                const holidayName = KR_HOLIDAYS[dateStr];
                
                const hasRecord = records[dateStr] && Object.values(records[dateStr]).some(v => v);
                
                let classes = 'day';
                if (isToday) classes += ' today';
                if (isSelected) classes += ' selected';
                
                // 날짜 숫자 색상 클래스 결정 (공휴일 > 일요일 > 토요일 순 우선)
                let numClass = '';
                if (holidayName || dayOfWeek === 0) {
                    numClass = holidayName ? 'holiday-num' : 'sunday-num';
                } else if (dayOfWeek === 6) {
                    numClass = 'saturday-num';
                }
                
                // 이 날짜에 해당하는 이벤트 찾기
                const dayEvents = events.filter(ev => dateStr >= ev.start && dateStr <= ev.end)
                    .sort((a, b) => a.start.localeCompare(b.start));
                
                let planHtml = '<div class="day-plan-list">';
                
                if (holidayName) {
                    planHtml += `<div class="day-holiday-name" title="${holidayName}">${holidayName}</div>`;
                }
                
                const visibleEvents = dayEvents.slice(0, 5);
                for (const ev of visibleEvents) {
                    planHtml += `<div class="day-plan-item" style="background:${ev.color}" title="${ev.title}" onclick="event.stopPropagation(); openEventModal('${ev.id}')">${escapeHtml(ev.title)}</div>`;
                }
                
                if (dayEvents.length > 5) {
                    planHtml += `<div class="day-plan-more" onclick="event.stopPropagation(); selectDate('${dateStr}')">+${dayEvents.length - 5}개</div>`;
                }
                
                planHtml += '</div>';
                
                html += `
                    <div class="${classes}" onclick="selectDate('${dateStr}')">
                        <button class="day-plus-btn" onclick="event.stopPropagation(); openEventModal(null, '${dateStr}')">+</button>
                        <div class="day-top">
                            <div class="day-number ${numClass}">${d}</div>
                            <div class="day-record-check">${hasRecord ? '✓' : ''}</div>
                        </div>
                        ${planHtml}
                    </div>
                `;
            }
            
            const remainingDays = 42 - (firstWeekday + lastDate);
            for (let i = 0; i < remainingDays; i++) {
                html += '<div class="day other-month"></div>';
            }
            
            document.getElementById('daysContainer').innerHTML = html;
        }
        
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        
        // ===== 날짜 선택 & 활동기록 =====
        function selectDate(dateStr) {
            selectedDate = dateStr;
            const date = new Date(dateStr);
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('selectedDate').textContent = date.toLocaleDateString('ko-KR', options);
            
            renderCalendar();
            renderRecordForm();
        }
        
        function renderRecordForm() {
            const container = document.getElementById('recordContent');
            
            if (!selectedDate) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">날짜를 선택해주세요</div>';
                return;
            }
            
            if (!records[selectedDate]) records[selectedDate] = {};
            
            let html = '';
            
            // 해당 날짜의 예정 작업 미리보기
            const dayEvents = events.filter(ev => selectedDate >= ev.start && selectedDate <= ev.end);
            if (dayEvents.length > 0) {
                html += '<div class="day-events-preview"><h4>📌 이 날의 예정 작업</h4>';
                for (const ev of dayEvents) {
                    html += `
                        <div class="preview-event-item" style="background:${ev.color}" onclick="openEventModal('${ev.id}')">
                            <span>${escapeHtml(ev.title)}</span>
                            <span class="edit-hint">수정 ✏️</span>
                        </div>
                    `;
                }
                html += '</div>';
            }
            
            // 카테고리별 활동 기록
            for (const category of categories) {
                const content = records[selectedDate][category] || '';
                html += `
                    <div class="category-record">
                        <div class="category-record-header">
                            <div class="category-name">${category}</div>
                        </div>
                        <textarea id="category-${category}" placeholder="활동 내용을 입력하세요...">${content}</textarea>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        function saveAllRecords() {
            if (!selectedDate) { showStatus('날짜를 선택해주세요', 'error'); return; }
            
            for (const category of categories) {
                const textarea = document.getElementById(`category-${category}`);
                if (textarea) records[selectedDate][category] = textarea.value.trim();
            }
            
            saveRecordsToStorage();
            renderCalendar();
            showStatus('✅ 저장되었습니다!', 'success');
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            setTimeout(() => { statusEl.className = 'status-message'; }, 3000);
        }
        
        // ===== 예정 작업 모달 (Google 캘린더 스타일) =====
        function renderColorPicker() {
            const container = document.getElementById('colorPicker');
            container.innerHTML = COLOR_PALETTE.map(color => `
                <div class="color-swatch" style="background:${color}" data-color="${color}" onclick="pickColor('${color}')"></div>
            `).join('');
        }
        
        function pickColor(color) {
            selectedColor = color;
            document.querySelectorAll('.color-swatch').forEach(sw => {
                sw.classList.toggle('selected', sw.dataset.color === color);
            });
        }
        
        function openEventModal(eventId, defaultDateStr) {
            editingEventId = eventId;
            const modal = document.getElementById('eventModal');
            const deleteBtn = document.getElementById('deleteEventBtn');
            
            if (eventId) {
                // 수정 모드
                const ev = events.find(e => e.id === eventId);
                if (!ev) return;
                
                document.getElementById('modalTitle').textContent = '📌 예정 작업 수정';
                document.getElementById('eventTitleInput').value = ev.title;
                document.getElementById('eventStartInput').value = ev.start;
                document.getElementById('eventEndInput').value = ev.end;
                selectedColor = ev.color;
                deleteBtn.style.display = 'block';
            } else {
                // 추가 모드
                const dateStr = defaultDateStr || formatDate(new Date());
                document.getElementById('modalTitle').textContent = '📌 예정 작업 추가';
                document.getElementById('eventTitleInput').value = '';
                document.getElementById('eventStartInput').value = dateStr;
                document.getElementById('eventEndInput').value = dateStr;
                selectedColor = COLOR_PALETTE[0];
                deleteBtn.style.display = 'none';
            }
            
            document.querySelectorAll('.color-swatch').forEach(sw => {
                sw.classList.toggle('selected', sw.dataset.color === selectedColor);
            });
            
            modal.classList.add('active');
        }
        
        function closeEventModal() {
            document.getElementById('eventModal').classList.remove('active');
            editingEventId = null;
        }
        
        function saveEvent() {
            const title = document.getElementById('eventTitleInput').value.trim();
            const start = document.getElementById('eventStartInput').value;
            const end = document.getElementById('eventEndInput').value;
            
            if (!title) { alert('작업 내용을 입력해주세요'); return; }
            if (!start || !end) { alert('기간을 설정해주세요'); return; }
            if (start > end) { alert('종료일은 시작일보다 빠를 수 없습니다'); return; }
            
            if (editingEventId) {
                const ev = events.find(e => e.id === editingEventId);
                if (ev) {
                    ev.title = title;
                    ev.start = start;
                    ev.end = end;
                    ev.color = selectedColor;
                }
            } else {
                events.push({
                    id: 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                    title, start, end, color: selectedColor
                });
            }
            
            saveEventsToStorage();
            closeEventModal();
            renderCalendar();
            if (selectedDate) renderRecordForm();
            showStatus('✅ 예정 작업이 저장되었습니다!', 'success');
        }
        
        function deleteEvent() {
            if (!editingEventId) return;
            if (!confirm('이 예정 작업을 삭제하시겠습니까?')) return;
            
            events = events.filter(e => e.id !== editingEventId);
            saveEventsToStorage();
            closeEventModal();
            renderCalendar();
            if (selectedDate) renderRecordForm();
            showStatus('🗑️ 삭제되었습니다', 'success');
        }
        
        // ===== 달력 네비게이션 =====
        function previousMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1);
            renderCalendar();
        }
        
        function nextMonth() {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1);
            renderCalendar();
        }
        
        function goToday() {
            currentDate = new Date();
            renderCalendar();
            selectDate(formatDate(new Date()));
        }
        
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 모달 바깥 클릭 시 닫기
        document.getElementById('eventModal').addEventListener('click', function(e) {
            if (e.target === this) closeEventModal();
        });
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
