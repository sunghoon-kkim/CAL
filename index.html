<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 일일 활동 기록 - 캘린더</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .top-controls {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .view-mode {
            display: flex;
            gap: 10px;
        }
        
        .view-btn {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .section-manager {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .section-manager h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .section-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .section-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .section-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .add-section-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .add-section-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .sections-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .section-tag {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
        }
        
        .section-tag.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .section-tag-delete {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: inherit;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        
        .section-tag-delete:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .calendar-box,
        .record-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .calendar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .calendar-header h2 {
            font-size: 24px;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .calendar {
            padding: 20px;
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .weekday-header {
            text-align: center;
            font-weight: 600;
            color: #667eea;
            padding: 10px;
            font-size: 14px;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            position: relative;
            padding: 8px;
            min-height: 80px;
        }
        
        .day:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        
        .day.other-month {
            color: #ccc;
            background: #f9f9f9;
            cursor: default;
        }
        
        .day.other-month:hover {
            border-color: #e0e0e0;
            box-shadow: none;
            transform: none;
        }
        
        .day.today {
            background: #667eea;
            color: white;
            border-color: #667eea;
            font-weight: bold;
        }
        
        .day.has-record {
            background: #e8f4f8;
            border-color: #667eea;
        }
        
        .day-number {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .day-indicator {
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            display: none;
        }
        
        .day.has-record .day-indicator {
            display: block;
        }
        
        .record-box {
            display: flex;
            flex-direction: column;
        }
        
        .record-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .record-header h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .selected-date {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .record-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 600px;
        }
        
        .section-record {
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            background: #f9f9f9;
        }
        
        .section-record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .section-name {
            font-weight: 600;
            color: #667eea;
            font-size: 15px;
        }
        
        .section-actions {
            display: flex;
            gap: 8px;
        }
        
        .section-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.3s;
        }
        
        .section-action-btn:hover {
            transform: scale(1.2);
        }
        
        .section-record textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            min-height: 80px;
            transition: border-color 0.3s;
        }
        
        .section-record textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .save-btn,
        .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .save-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .cancel-btn {
            background: #f0f0f0;
            color: #333;
        }
        
        .cancel-btn:hover {
            background: #e0e0e0;
        }
        
        .status-message {
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }
        
        .monthly-summary {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-top: 20px;
        }
        
        .monthly-summary h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .stat-label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .export-buttons {
            display: flex;
            gap: 10px;
        }
        
        .export-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .export-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .no-record {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 14px;
        }
        
        .report-view {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-top: 20px;
        }
        
        .report-item {
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 0;
        }
        
        .report-item:last-child {
            border-bottom: none;
        }
        
        .report-date {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 15px;
        }
        
        .report-section {
            margin-left: 15px;
            margin-bottom: 10px;
            padding: 10px;
            background: #f9f9f9;
            border-left: 3px solid #667eea;
            border-radius: 5px;
        }
        
        .report-section-name {
            font-weight: 600;
            color: #555;
            font-size: 13px;
            margin-bottom: 5px;
        }
        
        .report-section-content {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 28px;
            }
            
            .summary-stats {
                grid-template-columns: 1fr;
            }
            
            .top-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        @media (max-width: 600px) {
            .days {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }
            
            .day {
                min-height: 60px;
                font-size: 12px;
            }
            
            .day-number {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 일일 활동 기록</h1>
            <p>매일의 활동을 섹션별로 기록하고 관리하세요</p>
        </div>
        
        <!-- 뷰 모드 선택 -->
        <div class="top-controls">
            <div class="view-mode">
                <button class="view-btn active" onclick="setViewMode('month')">📅 월</button>
                <button class="view-btn" onclick="setViewMode('week')">📊 주</button>
                <button class="view-btn" onclick="setViewMode('day')">📝 날짜</button>
                <button class="view-btn" onclick="setViewMode('report')">📋 통계</button>
            </div>
        </div>
        
        <!-- 섹션 관리 -->
        <div class="section-manager">
            <h3>⚙️ 섹션 관리</h3>
            <div class="section-controls">
                <input 
                    type="text" 
                    id="newSectionInput" 
                    class="section-input" 
                    placeholder="새로운 섹션 이름을 입력하세요 (예: 수처리, 냉동기, 보일러)"
                >
                <button class="add-section-btn" onclick="addSection()">➕ 섹션 추가</button>
            </div>
            <div class="sections-list" id="sectionsList"></div>
        </div>
        
        <!-- 캘린더 & 기록 입력 -->
        <div class="main-content" id="mainContent">
            <!-- 캘린더 섹션 -->
            <div class="calendar-box">
                <div class="calendar-header">
                    <h2 id="monthYear"></h2>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="previousPeriod()">← 이전</button>
                        <button class="nav-btn" onclick="goToday()">오늘</button>
                        <button class="nav-btn" onclick="nextPeriod()">다음 →</button>
                    </div>
                </div>
                
                <div class="calendar">
                    <div class="weekdays">
                        <div class="weekday-header">일</div>
                        <div class="weekday-header">월</div>
                        <div class="weekday-header">화</div>
                        <div class="weekday-header">수</div>
                        <div class="weekday-header">목</div>
                        <div class="weekday-header">금</div>
                        <div class="weekday-header">토</div>
                    </div>
                    <div class="days" id="daysContainer"></div>
                </div>
            </div>
            
            <!-- 기록 입력 섹션 -->
            <div class="record-box">
                <div class="record-header">
                    <h3>📝 활동 기록</h3>
                    <div class="selected-date" id="selectedDate">날짜를 선택해주세요</div>
                </div>
                
                <div class="record-content" id="recordContent">
                    <div class="no-record">날짜를 선택해서 활동을 기록하세요</div>
                </div>
                
                <div style="padding: 20px; border-top: 1px solid #e0e0e0;">
                    <div class="button-group">
                        <button class="save-btn" onclick="saveAllRecords()">💾 저장하기</button>
                        <button class="cancel-btn" onclick="resetForm()">🔄 초기화</button>
                    </div>
                    <div class="status-message" id="statusMessage"></div>
                </div>
            </div>
        </div>
        
        <!-- 월별 통계 섹션 -->
        <div class="monthly-summary">
            <h3>📊 이달 통계</h3>
            <div class="summary-stats">
                <div class="stat-box">
                    <div class="stat-label">기록한 일수</div>
                    <div class="stat-value" id="recordCount">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">기록률</div>
                    <div class="stat-value" id="recordRate">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">활성 섹션</div>
                    <div class="stat-value" id="activeSections">0</div>
                </div>
            </div>
            
            <div class="export-buttons">
                <button class="export-btn" onclick="exportToCSV()">📥 CSV로 내보내기</button>
                <button class="export-btn" onclick="syncWithGoogle()">☁️ Google Sheets 동기화</button>
            </div>
        </div>
        
        <!-- 통계 뷰 -->
        <div id="reportView" style="display: none;">
            <div class="report-view">
                <h3>📋 활동 통계</h3>
                <div id="reportContent"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Google Apps Script URL
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSlyOzBo8EAFw-jxhior2bBFaEc9XrY39ZCcgO82X4aV54-OZcttnB-iYUwxOBNKjxqw/exec";
        
        let currentDate = new Date();
        let selectedDate = null;
        let records = {}; // { "2026-08-25": { "수처리": "내용", "냉동기": "내용" } }
        let sections = ['수처리', '냉동기', '보일러'];
        let viewMode = 'month';
        
        // 초기화
        function init() {
            loadRecords();
            loadSections();
            renderSections();
            renderCalendar();
            goToday();
        }
        
        // localStorage에서 기록 로드
        function loadRecords() {
            const stored = localStorage.getItem('activityRecords');
            records = stored ? JSON.parse(stored) : {};
        }
        
        // localStorage에서 섹션 로드
        function loadSections() {
            const stored = localStorage.getItem('activitySections');
            if (stored) {
                sections = JSON.parse(stored);
            }
        }
        
        // localStorage에 기록 저장
        function saveRecordsToStorage() {
            localStorage.setItem('activityRecords', JSON.stringify(records));
        }
        
        // localStorage에 섹션 저장
        function saveSectionsToStorage() {
            localStorage.setItem('activitySections', JSON.stringify(sections));
        }
        
        // 섹션 추가
        function addSection() {
            const input = document.getElementById('newSectionInput');
            const name = input.value.trim();
            
            if (!name) {
                alert('섹션 이름을 입력해주세요');
                return;
            }
            
            if (sections.includes(name)) {
                alert('이미 존재하는 섹션입니다');
                return;
            }
            
            sections.push(name);
            saveSectionsToStorage();
            input.value = '';
            renderSections();
            
            // 현재 날짜가 선택되어 있으면 폼 다시 렌더링
            if (selectedDate) {
                renderRecordForm();
            }
        }
        
        // 섹션 삭제
        function deleteSection(name) {
            if (!confirm(`'${name}' 섹션을 삭제하시겠습니까?`)) {
                return;
            }
            
            sections = sections.filter(s => s !== name);
            
            // 모든 기록에서 해당 섹션 제거
            for (const date in records) {
                delete records[date][name];
            }
            
            saveSectionsToStorage();
            saveRecordsToStorage();
            renderSections();
            
            if (selectedDate) {
                renderRecordForm();
            }
        }
        
        // 섹션 렌더링
        function renderSections() {
            const container = document.getElementById('sectionsList');
            container.innerHTML = sections.map(section => `
                <div class="section-tag">
                    <span>${section}</span>
                    <button class="section-tag-delete" onclick="deleteSection('${section}')">✕</button>
                </div>
            `).join('');
        }
        
        // 뷰 모드 변경
        function setViewMode(mode) {
            viewMode = mode;
            
            // 버튼 업데이트
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // UI 업데이트
            const mainContent = document.getElementById('mainContent');
            const reportView = document.getElementById('reportView');
            
            if (mode === 'report') {
                mainContent.style.display = 'none';
                reportView.style.display = 'block';
                renderReport();
            } else {
                mainContent.style.display = 'grid';
                reportView.style.display = 'none';
                renderCalendar();
            }
        }
        
        // 캘린더 렌더링
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', 
                              '7월', '8월', '9월', '10월', '11월', '12월'];
            document.getElementById('monthYear').textContent = `${year}년 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const firstWeekday = firstDay.getDay();
            const lastDate = lastDay.getDate();
            
            let html = '';
            
            for (let i = 0; i < firstWeekday; i++) {
                html += '<div class="day other-month"></div>';
            }
            
            const today = new Date();
            for (let date = 1; date <= lastDate; date++) {
                const dateObj = new Date(year, month, date);
                const dateStr = formatDate(dateObj);
                const isToday = dateObj.toDateString() === today.toDateString();
                const hasRecord = records[dateStr] && Object.values(records[dateStr]).some(v => v);
                
                let classes = 'day';
                if (isToday) classes += ' today';
                if (hasRecord) classes += ' has-record';
                
                html += `
                    <div class="${classes}" onclick="selectDate('${dateStr}')">
                        <div class="day-number">${date}</div>
                        <div class="day-indicator"></div>
                    </div>
                `;
            }
            
            const remainingDays = 42 - (firstWeekday + lastDate);
            for (let i = 0; i < remainingDays; i++) {
                html += '<div class="day other-month"></div>';
            }
            
            document.getElementById('daysContainer').innerHTML = html;
            updateStats();
        }
        
        // 날짜 선택
        function selectDate(dateStr) {
            selectedDate = dateStr;
            const date = new Date(dateStr);
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('selectedDate').textContent = date.toLocaleDateString('ko-KR', options);
            
            renderRecordForm();
        }
        
        // 기록 폼 렌더링
        function renderRecordForm() {
            const container = document.getElementById('recordContent');
            
            if (!selectedDate) {
                container.innerHTML = '<div class="no-record">날짜를 선택해서 활동을 기록하세요</div>';
                return;
            }
            
            if (!records[selectedDate]) {
                records[selectedDate] = {};
            }
            
            let html = '';
            
            for (const section of sections) {
                const content = records[selectedDate][section] || '';
                
                html += `
                    <div class="section-record">
                        <div class="section-record-header">
                            <div class="section-name">${section}</div>
                            <div class="section-actions">
                                <button class="section-action-btn" onclick="clearSection('${section}')" title="삭제">🗑️</button>
                            </div>
                        </div>
                        <textarea 
                            id="section-${section}" 
                            placeholder="활동 내용을 입력하세요..."
                        >${content}</textarea>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        // 섹션 내용 삭제
        function clearSection(section) {
            const textarea = document.getElementById(`section-${section}`);
            textarea.value = '';
        }
        
        // 모든 기록 저장
        function saveAllRecords() {
            if (!selectedDate) {
                showStatus('날짜를 선택해주세요', 'error');
                return;
            }
            
            // 각 섹션의 내용 수집
            for (const section of sections) {
                const textarea = document.getElementById(`section-${section}`);
                if (textarea) {
                    records[selectedDate][section] = textarea.value.trim();
                }
            }
            
            saveRecordsToStorage();
            renderCalendar();
            showStatus('✅ 저장되었습니다!', 'success');
            
            // Google Sheets에도 저장
            syncWithGoogle();
        }
        
        // 폼 초기화
        function resetForm() {
            if (selectedDate) {
                for (const section of sections) {
                    const textarea = document.getElementById(`section-${section}`);
                    if (textarea) {
                        textarea.value = records[selectedDate][section] || '';
                    }
                }
                showStatus('🔄 초기화되었습니다', 'success');
            }
        }
        
        // 상태 메시지 표시
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            
            setTimeout(() => {
                statusEl.className = 'status-message';
            }, 3000);
        }
        
        // 이전/다음 기간
        function previousPeriod() {
            if (viewMode === 'month') {
                currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1);
            } else if (viewMode === 'week') {
                currentDate.setDate(currentDate.getDate() - 7);
            } else if (viewMode === 'day') {
                currentDate.setDate(currentDate.getDate() - 1);
            }
            renderCalendar();
        }
        
        function nextPeriod() {
            if (viewMode === 'month') {
                currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1);
            } else if (viewMode === 'week') {
                currentDate.setDate(currentDate.getDate() + 7);
            } else if (viewMode === 'day') {
                currentDate.setDate(currentDate.getDate() + 1);
            }
            renderCalendar();
        }
        
        function goToday() {
            currentDate = new Date();
            renderCalendar();
            
            const today = formatDate(new Date());
            selectDate(today);
        }
        
        // 통계 렌더링
        function renderReport() {
            const container = document.getElementById('reportContent');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            let html = '';
            const dates = Object.keys(records).filter(dateStr => {
                const date = new Date(dateStr);
                return date.getFullYear() === year && date.getMonth() === month;
            }).sort();
            
            if (dates.length === 0) {
                html = '<div class="no-record">이 기간에 기록된 활동이 없습니다.</div>';
            } else {
                for (const dateStr of dates) {
                    const date = new Date(dateStr);
                    const dateLabel = date.toLocaleDateString('ko-KR', { 
                        month: 'long', 
                        day: 'numeric', 
                        weekday: 'short' 
                    });
                    
                    html += `<div class="report-item"><div class="report-date">${dateLabel}</div>`;
                    
                    for (const section of sections) {
                        const content = records[dateStr][section];
                        if (content) {
                            html += `
                                <div class="report-section">
                                    <div class="report-section-name">${section}</div>
                                    <div class="report-section-content">${content}</div>
                                </div>
                            `;
                        }
                    }
                    
                    html += '</div>';
                }
            }
            
            container.innerHTML = html;
        }
        
        // 통계 업데이트
        function updateStats() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            const lastDay = new Date(year, month + 1, 0).getDate();
            
            let recordCount = 0;
            for (let date = 1; date <= lastDay; date++) {
                const dateStr = formatDate(new Date(year, month, date));
                if (records[dateStr] && Object.values(records[dateStr]).some(v => v)) {
                    recordCount++;
                }
            }
            
            document.getElementById('recordCount').textContent = recordCount;
            document.getElementById('recordRate').textContent = 
                Math.round((recordCount / lastDay) * 100) + '%';
            document.getElementById('activeSections').textContent = sections.length;
        }
        
        // CSV 내보내기
        function exportToCSV() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            
            let csv = '날짜,' + sections.join(',') + '\n';
            
            const dates = Object.keys(records).filter(dateStr => {
                const date = new Date(dateStr);
                return date.getFullYear() === year && date.getMonth() + 1 === month;
            }).sort();
            
            for (const dateStr of dates) {
                const row = [dateStr];
                for (const section of sections) {
                    const content = records[dateStr][section] || '';
                    const escaped = content.replace(/"/g, '""').replace(/\n/g, ' ');
                    row.push(`"${escaped}"`);
                }
                csv += row.join(',') + '\n';
            }
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `활동기록_${year}년${month}월.csv`);
            link.click();
        }
        
        // Google Sheets 동기화
        async function syncWithGoogle() {
            if (!selectedDate) {
                return;
            }
            
            try {
                const data = {
                    date: selectedDate,
                    records: records[selectedDate],
                    timestamp: new Date().toLocaleString('ko-KR')
                };
                
                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(data),
                    mode: 'no-cors'
                });
            } catch (error) {
                console.error('동기화 오류:', error);
            }
        }
        
        // 날짜 포맷팅 (YYYY-MM-DD)
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 페이지 로드 시 초기화
        window.addEventListener('load', init);
    </script>
</body>
</html>
